[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zontar"
version = "0.1.0"
description = "ZONTAR / Tozaroa car-cover listing pipeline: tables as CSV in git, images in an asset store (local / NAS / OSS)."
requires-python = ">=3.11"
dependencies = ["pillow>=10", "openpyxl>=3.1"]

[project.optional-dependencies]
oss = ["oss2>=2.18"]

[project.scripts]
zontar = "zontar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
